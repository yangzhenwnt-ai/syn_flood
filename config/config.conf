# ===================================================
# SYN Defense Parameter Configuration File
# ===================================================

# ===== Basic Configuration =====
# Enable blocking (0=observation mode only, 1=enable blocking)
ENABLE_BLOCK=1

# Check interval (seconds)
CHECK_INTERVAL=60

# ===== Threshold Configuration =====
# SYN_RECV connection count threshold for single IP (will be banned if exceeded)
# Recommended: 30-50, too low may cause false blocking of legitimate users
SINGLE_IP_THRESHOLD=30

# Subnet detection: minimum IP count in same C-class
# Recommended: 8-15 (temporarily adjusted to 5 to handle current attack)
SUBNET_IP_COUNT=5

# Subnet detection: total connection count threshold for same C-class
# Recommended: 50-100
SUBNET_CONN_COUNT=50

# Trigger detection total SYN_RECV count
# No detection performed when below this value (performance optimization)
# Recommended: 100-300
TOTAL_THRESHOLD=200

# ===== Distributed Attack Detection =====
# Unique IP count threshold (triggers distributed attack detection)
# When unique IP count exceeds this value, enable low-frequency IP ban strategy
# Recommended: 50-200
DISTRIBUTED_IP_THRESHOLD=100

# Minimum threshold for single IP during distributed attack
# During high-density distributed attack (many different IPs), lower ban threshold
# Recommended: 2-5 (even IPs with only a few connections will be banned)
DISTRIBUTED_SINGLE_THRESHOLD=3

# IP density ratio (unique IPs / total connections)
# When ratio exceeds this value, considered high-density distributed attack
# 0.5 = average 2 connections per IP, 0.7 = average 1.4 connections per IP
# Recommended: 0.3-0.7
DISTRIBUTED_DENSITY_RATIO=0.5

# ===== Ban Configuration =====
# Ban duration (seconds)
# 3600 = 1 hour, 7200 = 2 hours, 86400 = 24 hours
BAN_DURATION=3600

# Maximum blacklist entries (prevent memory overflow)
MAX_BLACKLIST_SIZE=10000

# Subnet attack ban mode
# subnet = Ban entire C-class (/24), more thorough but may false-block legitimate users in same subnet
# ip = Only ban detected malicious IPs (default, safer)
SUBNET_BAN_MODE=subnet

# ===== Log Configuration =====
# Log file path
LOG_FILE="/var/log/syn_defense.log"

# Log retention line count (automatic cleanup)
LOG_MAX_LINES=50000

# Enable detailed logging (0=off, 1=on)
DEBUG_MODE=0

# ===== Security Configuration =====
# Whitelist configuration file path
WHITELIST_FILE="/etc/syn_defense/whitelist.conf"

# IPSET names
WHITELIST_SET="syn_whitelist"
BLACKLIST_SET="syn_blacklist"
