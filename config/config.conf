# ===================================================
# SYN 防护参数配置文件
# ===================================================

# ===== 基础配置 =====
# 是否启用封禁（0=仅观察模式，1=启用封禁）
ENABLE_BLOCK=1

# 检查间隔（秒）
CHECK_INTERVAL=60

# ===== 阈值配置 =====
# 单IP的SYN_RECV连接数阈值（超过此值将被封禁）
# 建议值：30-50，太低可能误封正常用户
SINGLE_IP_THRESHOLD=30

# 网段检测：同一C段最少IP数量
# 建议值：8-15（临时调整为5以应对当前攻击）
SUBNET_IP_COUNT=5

# 网段检测：同一C段的总连接数阈值
# 建议值：50-100
SUBNET_CONN_COUNT=50

# 触发检测的总SYN_RECV数量
# 小于此值时不执行检测（性能优化）
# 建议值：100-300
TOTAL_THRESHOLD=200

# ===== 分布式攻击检测 =====
# 唯一IP数量阈值（触发分布式攻击检测）
# 当唯一IP数超过此值时，启用低频IP封禁策略
# 建议值：50-200
DISTRIBUTED_IP_THRESHOLD=100

# 分布式攻击时的单IP最低阈值
# 在高度分布式攻击时（大量不同IP），降低封禁阈值
# 建议值：2-5（每个IP只有几个连接也会被封）
DISTRIBUTED_SINGLE_THRESHOLD=3

# IP密度比率（唯一IP数/总连接数）
# 当比率超过此值时，认为是高度分布式攻击
# 0.5 = 平均每IP只有2个连接，0.7 = 平均每IP只有1.4个连接
# 建议值：0.3-0.7
DISTRIBUTED_DENSITY_RATIO=0.5

# ===== 封禁配置 =====
# 封禁时长（秒）
# 3600 = 1小时，7200 = 2小时，86400 = 24小时
BAN_DURATION=3600

# 黑名单最大条目数（防止内存溢出）
MAX_BLACKLIST_SIZE=10000

# 网段攻击封禁模式
# subnet = 封禁整个C段（/24）更彻底，但可能误封同网段正常用户
# ip = 仅封禁检测到的恶意IP（默认，更安全）
SUBNET_BAN_MODE=subnet

# ===== 日志配置 =====
# 日志文件路径
LOG_FILE="/var/log/syn_defense.log"

# 日志保留行数（自动清理）
LOG_MAX_LINES=50000

# 是否启用详细日志（0=关闭，1=开启）
DEBUG_MODE=0

# ===== 安全配置 =====
# 白名单配置文件路径
WHITELIST_FILE="/etc/syn_defense/whitelist.conf"

# IPSET名称
WHITELIST_SET="syn_whitelist"
BLACKLIST_SET="syn_blacklist"

